name: Release

# Builds, signs and publishes the per-platform packages when a version
# tag is pushed. The tag must match plugin.json, e.g. v1.0.0 for
# "version": "1.0.0". A version with a prerelease part (0.1.0-beta.1) is
# published as a GitHub prerelease.
#
# Four stages with separate privileges:
#   test     runs the tests against the webapp release, read only, no secrets
#   build    one native job per platform, read only, no secrets
#   package  takes the webapp release, packages and signs, holds the signing key
#            through the "release" environment, read only
#   publish  creates the GitHub release, the only job that can write
#
# The "release" environment holds PLUGIN_SIGNING_KEY (the minisign secret key
# file) and PLUGIN_SIGNING_KEY_PASSWORD. Give the environment a required
# reviewer so a pushed tag alone cannot sign. The PLUGIN_SIGNING_PUBLIC_KEY
# variable, the matching public key, lets the run verify what it signed. The
# catalog (nginxui/plugins) polls this repository's releases and picks the new
# one up on its own.
#
# No cargo cache is used here, so a cache written by a pull request can never
# end up in a signed binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin-log-analytics-tantivy
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics-tantivy
          persist-credentials: false

      # The API shape and search syntax tests read the webapp source of the
      # release this plugin packages.
      - name: Read webapp.lock
        id: webapp
        run: echo "version=$(sed -n 's/^version=//p' webapp.lock)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          repository: nginxui/plugin-log-analytics-webapp
          ref: v${{ steps.webapp.outputs.version }}
          path: plugin-log-analytics-webapp
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches plugin.json and Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' plugin.json | head -n 1)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match plugin.json version ${version}"
            exit 1
          fi
          if [ "${tag}" != "${crate}" ]; then
            echo "tag v${tag} does not match Cargo.toml version ${crate}"
            exit 1
          fi

      # Downloads the webapp release webapp.lock names and checks it against the
      # checksum published with it. The manifest tests compare plugin.json with
      # its build.
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      - run: cargo test --locked

      - name: plugin.json follows the plugin-spec schema
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/plugin.schema.json" \
            https://raw.githubusercontent.com/nginxui/plugin-spec/main/schema/plugin.schema.json
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false \
            -c ajv-formats -s "${RUNNER_TEMP}/plugin.schema.json" -d plugin.json

  build:
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Every platform runs to the end, so one release run shows every failure;
      # the package job needs them all anyway.
      fail-fast: false
      matrix:
        include:
          - key: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Cross built from the arm64 runner: the Intel macOS runners are
          # retired, and the target only needs the Apple SDK of the host.
          - key: darwin-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - key: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          # MSVC rather than GNU: it is what Rust tests on Windows, and
          # mimalloc is left out of Windows builds anyway (see Cargo.toml).
          - key: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - key: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - key: windows-386
            runner: windows-latest
            target: i686-pc-windows-msvc
          # No runners for these, they are cross built with zig as build.sh does
          - key: linux-386
            runner: ubuntu-latest
            target: i686-unknown-linux-musl
            zig: true
          - key: linux-arm
            runner: ubuntu-latest
            target: arm-unknown-linux-musleabi
            zig: true
          - key: linux-riscv64
            runner: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            zig: true
          - key: linux-loong64
            runner: ubuntu-latest
            target: loongarch64-unknown-linux-musl
            zig: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics-tantivy
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Static musl binaries need the musl C compiler for the C parts of the
      # dependencies (lzma, mimalloc, ring).
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl') && !matrix.zig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build the executable
        shell: bash
        working-directory: plugin-log-analytics-tantivy
        env:
          KEY: ${{ matrix.key }}
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          if [[ "${ZIG}" == "true" ]]; then
            cargo zigbuild --locked --release --target "${TARGET}" --bin log-analytics-tantivy
          else
            if [[ "${TARGET}" == *linux-musl ]]; then
              export "CC_${TARGET//-/_}=musl-gcc"
            fi
            cargo build --locked --release --target "${TARGET}" --bin log-analytics-tantivy
          fi
          ext=""
          if [[ "${KEY}" == windows-* ]]; then
            ext=".exe"
          fi
          mkdir -p "${RUNNER_TEMP}/out"
          cp "target/${TARGET}/release/log-analytics-tantivy${ext}" "${RUNNER_TEMP}/out/log-analytics-tantivy-${KEY}${ext}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.key }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      has_notes: ${{ steps.meta.outputs.has_notes }}
    defaults:
      run:
        working-directory: plugin-log-analytics-tantivy
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics-tantivy
          # git-cliff reads the commits since the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Downloads the webapp release webapp.lock names and checks it against the
      # checksum published with it
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      # The path is relative to the workspace, not to the working directory.
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: plugin-log-analytics-tantivy/binaries

      - name: Package
        run: ./build.sh --prebuilt binaries

      - name: One archive per platform plugin.json names
        run: |
          expected=$(jq '.server.executables | length' plugin.json)
          count=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "${count}" -ne "${expected}" ]; then
            echo "expected ${expected} archives, found ${count}"
            exit 1
          fi

      # Signs the packages with the official plugin key and checks them. The
      # publish job releases them, apart from the signing key.
      - uses: nginxui/plugin-release@v1
        with:
          working-directory: plugin-log-analytics-tantivy
          signing-key: ${{ secrets.PLUGIN_SIGNING_KEY }}
          signing-key-password: ${{ secrets.PLUGIN_SIGNING_KEY_PASSWORD }}
          certificate: ''
          trusted-key: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}

      # The notes list the features and fixes since the previous tag, generated
      # from the commit messages by git-cliff (cliff.toml).
      - name: Release metadata
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="dist/notes.md"
          npx --yes git-cliff@2.14.2 --current --strip all --output "${notes}"
          if grep -q '[^[:space:]]' "${notes}"; then
            echo "has_notes=true" >>"${GITHUB_OUTPUT}"
          else
            echo "No feature or fix since the previous tag, the notes will be generated by GitHub"
            echo "has_notes=false" >>"${GITHUB_OUTPUT}"
          fi
          case "${version}" in
            *-*) echo "prerelease=true" >>"${GITHUB_OUTPUT}" ;;
            *) echo "prerelease=false" >>"${GITHUB_OUTPUT}" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            plugin-log-analytics-tantivy/dist/*.tar.gz
            plugin-log-analytics-tantivy/dist/*.tar.gz.sha256
            plugin-log-analytics-tantivy/dist/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_NOTES: ${{ needs.package.outputs.has_notes }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The artifact keeps the common parent of its files, so find them.
          files=$(find release -name '*.tar.gz' -o -name '*.tar.gz.sha256')
          notes_file=$(find release -name notes.md)
          args=(--repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}")
          if [ "${HAS_NOTES}" = "true" ]; then
            args+=(--notes-file "${notes_file}")
          else
            args+=(--generate-notes)
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" ${files}
