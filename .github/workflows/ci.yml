name: CI

# Runs on every pull request and on main. The Rust SDK comes from crates.io as
# nginxui-plugin-sdk. The webapp comes from
# plugin-log-analytics-webapp: the tests read its source at the release that
# webapp.lock names, and the packages carry that release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-log-analytics-tantivy
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-log-analytics-tantivy

      # The API shape and search syntax tests read the webapp source of the
      # release this plugin packages.
      - name: Read webapp.lock
        id: webapp
        run: echo "version=$(sed -n 's/^version=//p' webapp.lock)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          repository: nginxui/plugin-log-analytics-webapp
          ref: v${{ steps.webapp.outputs.version }}
          path: plugin-log-analytics-webapp

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-log-analytics-tantivy

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      # The debug profile keeps the build short (the test profile carries no
      # debug info). The perf dataset test is ignored and stays out of CI.
      - run: cargo test --locked

  manifest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-log-analytics-tantivy
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-log-analytics-tantivy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-log-analytics-tantivy

      # Downloads the webapp release webapp.lock names and checks it against the
      # checksum published with it
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      # plugin.json is committed and the catalog reads it from the release
      # tag, so it must be what the manifest binary generates from the code
      # and the webapp fragment of the release.
      - name: plugin.json is up to date
        run: |
          cargo run --locked --quiet --bin manifest -- -out "${RUNNER_TEMP}/plugin.json" >/dev/null
          diff -u plugin.json "${RUNNER_TEMP}/plugin.json"
